[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "querysmith"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.105.2",
    "chromadb>=1.5.9",
    "fastapi>=0.136.1",
    "fastembed>=0.8.0",
    "numpy>=2.4.6",
    "pydantic>=2.13.4",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
    "sqlglot>=30.8.0",
    "uvicorn>=0.47.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM", "RUF"]
